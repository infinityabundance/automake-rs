[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Project maintenance tasks for automake-rs: fmt, clippy, tests, receipt freshness, court replay, document generation, DSSE signing."
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
sha2.workspace = true
hmac = "0.12"
regex = "1"
automake-oracle-rs = { path = "../crates/automake-oracle-rs" }
automake-casefile-rs = { path = "../crates/automake-casefile-rs" }
automake-rs-core = { path = "../crates/automake-rs-core" }
tempfile = "3"
libc = "0.2"
