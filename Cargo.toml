[package]
name = "automake-rs"
version = "0.1.22"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description.workspace = true
readme = "README.md"
keywords = ["automake", "makefile", "build-system", "autotools", "gnu"]
categories = ["command-line-utilities", "development-tools"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "automake-rs"
path = "src/main.rs"

[dependencies]
automake-rs-core = { version = "0.1.22", path = "crates/automake-rs-core" }
automake-oracle-rs = { version = "0.1.22", path = "crates/automake-oracle-rs" }
automake-casefile-rs = { version = "0.1.22", path = "crates/automake-casefile-rs" }
automake-rs-cli = { version = "0.1.22", path = "crates/automake-rs-cli" }

[workspace]
resolver = "2"
members = [
    "crates/automake-rs-core",
    "crates/automake-rs-cli",
    "crates/automake-oracle-rs",
    "crates/automake-casefile-rs",
    "xtask",
]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"

[workspace.package]
version = "0.1.22"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/infinityabundance/automake-rs"
authors = ["infinityabundance <255699974+infinityabundance@users.noreply.github.com>"]
description = "Forensic-parity Rust reimplementation of GNU Automake behavior through oracle courts."

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
